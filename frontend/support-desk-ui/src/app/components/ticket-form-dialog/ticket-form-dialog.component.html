<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ initialData ? 'Edit Ticket' : 'Create New Ticket' }}</h3>
      <button class="close-btn" (click)="onCancel()">&times;</button>
    </div>

    <div class="alert alert-danger" *ngIf="serverError">
      {{ serverError }}
    </div>

    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" formControlName="title" placeholder="Brief summary of the issue" />
        <small class="error-text" *ngIf="ticketForm.get('title')?.touched && ticketForm.get('title')?.hasError('required')">Title is required.</small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Customer Name *</label>
          <input type="text" formControlName="customerName" placeholder="John Doe" />
          <small class="error-text" *ngIf="ticketForm.get('customerName')?.touched && ticketForm.get('customerName')?.hasError('required')">Name is required.</small>
        </div>

        <div class="form-group">
          <label>Customer Email *</label>
          <input type="email" formControlName="customerEmail" placeholder="customer@example.com" />
          <small class="error-text" *ngIf="ticketForm.get('customerEmail')?.touched && ticketForm.get('customerEmail')?.hasError('email')">Enter a valid email.</small>
        </div>
      </div>

      <div class="form-group">
        <label>Priority *</label>
        <select formControlName="priority">
          <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea formControlName="description" rows="4" placeholder="Detailed description of the issue..."></textarea>
        <small class="error-text" *ngIf="ticketForm.get('description')?.touched && ticketForm.get('description')?.hasError('minlength')">Description must be at least 10 characters.</small>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="ticketForm.invalid">
          {{ initialData ? 'Save Changes' : 'Submit Ticket' }}
        </button>
      </div>
    </form>
  </div>
</div>
